# Auto Review profile layer: coexistence mode.
#
# This package contributes its own `auto-review` permission preset (declared in
# the `permission` row config below) and its own escalation reviewer, while the
# shipped `@deepseek-ai/dsh-experimental-auto-review` row STAYS ENABLED.
#
# The shipped row must not be disabled: `auto` is a RESERVED preset id
# (`dsh-permission-presets` refuses to compose it from row config), and the
# reserved state exists only while the shipped row is mounted. Sessions whose
# last `permission/preset` event is `auto` cannot cold-open without it — they
# fail resolution at attach and the UI shows them permanently unavailable.
#
# Why a separate preset rather than the shipped `auto`: the shipped preset's
# sandbox/approval bundle is `AUTO_PRESET_SPEC`, a private constant, so its
# sandbox cannot be restated from outside. Declaring our own preset makes the
# workspace-write contract plain configuration.
#
# The two features do not collide: the shipped row owns the reserved `auto`
# state and its reviewer; this package owns the `auto-review` preset and its
# reviewer (it never registers `auto`). Each preset routes to its own reviewer.
# If this package's plugin fails, the `auto-review` preset still selects
# workspace-write + ask and approvals fall through to the human answerer.
- insert:
    - id: auto-review-ww
      name: dsh-auto-review-ww
      # Optional decision-model reviewer (see README). Uncomment to enable; the
      # default `auto` mode needs an API key in the environment, so an existing
      # installation keeps the chat reviewer until one is configured.
      # config:
      #   mode: auto                    # auto | chat | decision
      #   decision:
      #     api: typesafe-system-one    # typesafe-system-one | openai-decisions
      #     model: jev-latest           # default: jev-latest / gpt-6-luna
      #     apiKeyEnv: TYPESAFE_API_KEY # or OPENAI_API_KEY
      #     allowThreshold: 0.85
      #     denyThreshold: 0.2
      #     escalate: chat              # chat | deny
      #     confirmDenials: true        # medium denials get the chat reviewer's reason
      #     escalateOnTruncation: true  # a shed-history verdict is not trusted
      #     maxStateChars: 90000        # Jev default; GPT-6 Luna defaults to 600000
      #     timeoutMs: 20000
# A patch replaces the targeted row's whole `config`, so every shipped preset is
# restated here alongside the new one.
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
      auto-review:
        sandbox: workspace-write
        approval: ask
        name: Auto review
        description: "Workspace-write sandbox: ordinary project work runs unreviewed; only an escalation beyond the workspace is reviewed by the current agent's model."
